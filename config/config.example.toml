# Crusty-Claude configuration example.
#
# Layers, later wins (tables merge key by key):
#   built-in defaults → ~/.crusty/config.toml → <project>/.crusty/config.toml
#   → <project>/.crusty/config.local.toml → --config <file>
# Secrets never go in this file: providers name an environment variable (`*_env`).
# A key that looks like a secret stored in plain text makes the config invalid.
# `crusty config show` prints the effective configuration.

# ── Orchestrator ─────────────────────────────────────────────────────────────
# The main agent is ALWAYS the orchestrator: it plans and delegates with `Task`.
[orchestrator]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "xhigh"                 # low | medium | high | xhigh | max
max_output_tokens = 32000
max_steps = 60                   # model calls per user prompt
max_parallel_agents = 3          # executors running at once
max_review_loops = 2             # reviewer delegations per prompt, beyond the first
max_depth = 1                    # executors cannot delegate further
# Tools the orchestrator may call itself; everything else goes through executors.
direct_tools = ["Read", "Glob", "Grep", "LS", "Graph", "Retrieve", "WebSearch", "WebFetch", "TodoWrite", "Skill", "ToolSearch", "Task"]
# fallback = ["anthropic:claude-sonnet-5-5"]   # tried when the model is unavailable
# token_budget = 2000000                       # hard cap (real usage) per prompt
# cost_budget_usd = 5.0

# ── Default executor profile (domains inherit unset fields) ─────────────────
[executor]
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_output_tokens = 16000

# ── Executor domains: one model per domain ──────────────────────────────────
# Change them at runtime with `/domain <name> <provider:model> [effort]`.
# Custom agents in .crusty/agents/*.md or .claude/agents/*.md add domains too.
[domains.coder]
description = "Implementation and refactoring"
model = "claude-sonnet-5-5"
effort = "medium"

[domains.reviewer]
description = "Independent review of changes; reports findings, changes nothing"
model = "claude-sonnet-5-5"
effort = "medium"
tools = ["Read", "Glob", "Grep", "LS", "Graph", "Retrieve", "TodoWrite", "Bash"]

[domains.designer]
description = "UX, interface and product design"
model = "claude-sonnet-5-5"

[domains.graphiste]
description = "Graphic design: visuals, SVG, palettes, image assets"
model = "claude-sonnet-5-5"

[domains.web_researcher]
description = "Web research and source synthesis with provenance"
model = "claude-haiku-5-5"
effort = "low"

# Another provider for one domain, e.g. a local model:
# [domains.documentation]
# description = "Technical documentation and guides"
# provider = "ollama"
# model = "qwen3-coder"

# ── Providers ────────────────────────────────────────────────────────────────
[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
auth_token_env = "ANTHROPIC_AUTH_TOKEN"
anthropic_version = "2026-10-21"
server_fallbacks = true          # server-side refusal fallbacks on models that support them
# via_proxy = "headroom"         # send every call through a [[proxy.upstreams]] entry

[providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.openrouter]
kind = "openai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.ollama]
kind = "openai"
base_url = "http://127.0.0.1:11434/v1"

# Offline scripted provider (tests, demos): --model mock:mock
[providers.mock]
kind = "mock"

# ── Prices (USD per million tokens) and model facts ─────────────────────────
# Defaults cover current Claude models; costs shown are estimates from list prices.
# [pricing."my-model"]
# input = 1.0
# output = 4.0
# cache_read = 0.1
# cache_write = 1.25
# [models."my-model"]
# context_window = 128000
# max_output = 16000
# vision = false

# ── Permissions ──────────────────────────────────────────────────────────────
[permissions]
mode = "default"                 # default | acceptEdits | plan | bypassPermissions
allow = ["Bash(cargo test:*)", "Bash(git status)", "Read(./**)"]
ask = []
deny = ["Bash(git push --force:*)"]
workspace_only = true
additional_dirs = []

[security]
allow_network = true
block_private_networks = true    # SSRF guard for WebFetch
max_fetch_bytes = 5242880
max_redirects = 5
bash_default_timeout_secs = 120
bash_max_timeout_secs = 600

# ── Web ──────────────────────────────────────────────────────────────────────
[web]
search_backend = "none"          # none | brave | tavily | searxng | anthropic (server-side)
brave_api_key_env = "BRAVE_API_KEY"
tavily_api_key_env = "TAVILY_API_KEY"
# searxng_url = "http://127.0.0.1:8080"

# ── Optimizer pipeline ───────────────────────────────────────────────────────
# Tool output: RTK filters, HTML→Markdown. Requests: Headroom → Context Gate → pxpipe.
# Every stage is measured; the side panel shows estimates (est.) and real counts apart.
[optimizer]
enabled = true
mode = "active"                  # active | observe (measure only)
preserve_original = true         # originals retrievable with the Retrieve tool
minimum_estimated_gain = 0.05
measure_with_count_tokens = true    # real "before" counts (count_tokens on Anthropic/Bedrock/Vertex, tiktoken for OpenAI)

[optimizer.rtk]
enabled = true
prefer_external = false          # true: run supported commands through the `rtk` binary
max_lines = 400

[optimizer.html_to_markdown]
enabled = true
max_chars = 100000

[optimizer.graphify]
enabled = true
auto_index = true
repo_map_tokens = 1500
use_external_report = true       # also read graphify-out/GRAPH_REPORT.md if present

[optimizer.headroom]
enabled = true
mode = "native"                  # native | external (send requests to external_url)
external_url = "http://127.0.0.1:8787"
protect_recent_messages = 6
min_block_tokens = 400
batch_tokens = 8000              # cache-aware: the compressed prefix grows in steps

[optimizer.context_gate]
enabled = true
policy = "gain"                  # gain | threshold
min_tokens = 60000
# window = 200000                # zone reference; default: the model's context window
horizon = 20
cache_read = 0.1
cache_write = 1.25
overhead = 0.2
margin = 0.05
sticky = true
unstick_ratio = 0.15
dryrun_ms = 5000
min_saving_tokens = 2000
max_verbatim_risk = 0.02         # refuse imaging when hashes/ids/secrets dominate
breaker_failures = 3
breaker_cooldown_secs = 300

[optimizer.pxpipe]
enabled = true
mode = "native"                  # native renderer | external (pxpipe proxy at external_url)
external_url = "http://127.0.0.1:47821"
allowed_models = ["claude-fable-5-1", "claude-fable-5", "claude-opus-5-5", "claude-sonnet-5-5"]
protect_recent_messages = 8
min_block_chars = 2000

[optimizer.ponytail]
enabled = true                   # injected into EVERY agent's system prompt
level = "full"                   # lite | full | ultra

# ── Token-saving proxies (agnostic) ──────────────────────────────────────────
# Any Anthropic/OpenAI-compatible proxy. Health and stats appear in the side panel.
# Route a provider through one with `via_proxy` or `/proxy route <provider> <name>`.
# [[proxy.upstreams]]
# name = "headroom"
# url = "http://127.0.0.1:8787"
# kind = "headroom"
# health_path = "/livez"
# stats_path = "/stats"

[proxy]
listen = "127.0.0.1:47840"       # `crusty proxy`
forward_url = "https://api.anthropic.com"
health_interval_secs = 10

# ── UI ───────────────────────────────────────────────────────────────────────
[tui]
show_optimizer_panel = true
show_token_metrics = true
show_thinking = true
side_panel_width = 46
tick_ms = 250

# ── Sessions and memory ──────────────────────────────────────────────────────
[session]
auto_compact = true
compact_threshold = 0.8
keep_recent_on_compact = 6
memory_files = ["CRUSTY.md", "CLAUDE.md"]

# ── Hooks (Claude Code compatible events) ────────────────────────────────────
# Exit code 2 blocks with stderr as the message; JSON on stdout can also decide.
# [[hooks.PreToolUse]]
# matcher = "Bash"
# command = "./scripts/check-command.sh"
# timeout_secs = 30

# ── MCP servers (also read from .mcp.json) ──────────────────────────────────
# [mcp.servers.github]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-github"]
# [mcp.servers.docs]
# url = "https://example.com/mcp"

# ── Sandbox OS des commandes Bash (crusty-sandbox) ───────────────────────────
# Linux: bubblewrap, else Landlock. macOS: Seatbelt. Windows: Job Object only
# (kills the process tree; NO filesystem or network isolation).
[sandbox]
mode = "workspace-write"         # off | read-only | workspace-write
network = true
writable_roots = []
fail_if_unavailable = false      # true: refuse to run a command when no sandbox works
allow_unsandboxed_requests = true  # model may ask dangerouslyDisableSandbox; always asked

# ── Laya (laya-serve, optional; native fallback when absent) ─────────────────
# Laya can only make security decisions stricter (except `auto` mode, risk <= moderate).
# laya.url must be https or loopback http.
[laya]
enabled = true
url = "http://127.0.0.1:8000"
api_key_env = "LAYA_API_KEY"
timeout_ms = 1500
health_interval_secs = 30
min_confidence = 0.6             # below: unsure, the native fallback decides

[laya.guard]                     # allow/review/block on Bash commands and sensitive writes
commands = true
files = true
# sensitive_paths = ["**/.env", "**/.github/workflows/**", "**/Dockerfile"]  # defaults are longer

[laya.dlp]                       # outbound masking: secrets and PII become ⟦SECRET_n⟧
enabled = true
secrets = true
pii = true
ambiguous_threshold = 0.5
rehydrate = true                 # restore masked values in tool inputs
allow_values = []

[laya.rerank]
enabled = true
min_items = 30
keep = 20

[laya.pruner]                    # stale tool results, batched (cache-stable), retrievable
enabled = true
keep_recent_messages = 12
min_relevance = 0.15
batch_messages = 8

[laya.triage]                    # failed build/test logs
enabled = true
min_lines = 60
max_blocks = 8
context_lines = 3

[laya.router]                    # trivial/routine/hard/research -> Haiku/Sonnet/Opus
enabled = true                   # --model or /model pins the model; /model auto re-enables
every_prompt = false
min_confidence = 0.475

[laya.intent]                    # defer irrelevant MCP tools behind ToolSearch
enabled = true
defer_mcp_tools = true
min_relevance = 0.3
always_load = []

[laya.auto_mode]                 # `auto` permission mode
threshold = 0.8

# ── Checkpoints and /rewind ──────────────────────────────────────────────────
# Tracks edits made by the file tools (not shell-command changes, not .git).
[checkpoints]
enabled = true
max_file_bytes = 5242880
keep_sessions = 20

# ── Skills (SKILL.md) and plugins (plugin.json) ──────────────────────────────
[skills]
enabled = true
disabled = []

[plugins]                        # project plugins load only after `crusty trust`
enabled = true
disabled = []
